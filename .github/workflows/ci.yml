name: Validate FinSight
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r backend/requirements-dev.txt
      - run: ruff check backend/app backend/tests scripts --config backend/pyproject.toml
      - run: ruff format --check backend/app backend/tests scripts --config backend/pyproject.toml
      - run: python -m pytest
        working-directory: backend
  workbench:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install --require-hashes -r backend/requirements-dev.txt
      - run: npm ci
        working-directory: frontend
      - run: npm run build && npm run lint
        working-directory: frontend
      - run: python scripts/prepare.py
      - run: python scripts/evaluate.py
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start local workbench
        run: |
          PYTHONPATH=backend python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/finsight-api.log 2>&1 &
          python -c "import time,urllib.request; time.sleep(3); urllib.request.urlopen('http://127.0.0.1:8000/health')"
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-and-browser-evidence
          path: |
            evaluation/results.json
            frontend/test-results/
